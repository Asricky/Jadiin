name: Verify Makrab Planner
on: [push, pull_request]
jobs:
  critical-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime
      - name: Configure local test environment
        shell: bash
        run: |
          npx supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          printf 'NEXT_PUBLIC_SUPABASE_URL=%s\nNEXT_PUBLIC_SUPABASE_ANON_KEY=%s\nSUPABASE_SERVICE_ROLE_KEY=%s\nNEXT_PUBLIC_APP_URL=http://localhost:3000\nPARTICIPANT_TOKEN_SECRET=%s\n' "$API_URL" "$ANON_KEY" "$SERVICE_ROLE_KEY" "$(openssl rand -hex 32)" > .env.local
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_PRODUCTION: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
